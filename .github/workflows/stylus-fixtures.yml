name: Stylus fixtures

# Records what starts Gboard's stylus mode (a "Try out your stylus" sheet and
# a handwriting toolbar in place of the keyboard), and what closes it, on
# clean emulators: one job per API level and gesture, the field of the probe
# app in Expo Go tapped before the gesture and after it, and each way to
# close what shows (the Escape key, a tap on the sheet's Cancel button, the
# Back key). The script keeps the raw adb output. Run it by hand when the
# commands need new output. Each job uploads one artifact.
on:
  workflow_dispatch:
    inputs:
      api-levels:
        description: "API levels, as a JSON list"
        required: true
        default: "[35, 36]"
      gestures:
        description: "Gestures, as a JSON list"
        required: true
        default: '["none", "double-tap", "drag", "pinch", "finger"]'

# The token only reads the repository.
permissions:
  contents: read

jobs:
  record:
    name: Record (API ${{ matrix.api-level }}, ${{ matrix.gesture }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: ${{ fromJSON(inputs.api-levels) }}
        gesture: ${{ fromJSON(inputs.gestures) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Metro loads the probe from its build output, and the script runs the
      # built loupe CLI.
      - name: Build
        run: pnpm run build

      # The emulator needs KVM. A Linux runner gives access to it only with
      # this udev rule.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The same emulator as the other recordings and the smoke run.
      - name: Record on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: node scripts/record-stylus.mjs "${{ runner.temp }}/stylus/api-${{ matrix.api-level }}/${{ matrix.gesture }}" ${{ matrix.gesture }}

      # A partial recording still helps, so it uploads after a failure too.
      - name: Upload the recording
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: stylus-api-${{ matrix.api-level }}-${{ matrix.gesture }}
          path: ${{ runner.temp }}/stylus/
          retention-days: 14
          if-no-files-found: error
