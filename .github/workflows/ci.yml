name: CI

on:
  pull_request:
  push:
    branches:
      - main

# The token only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # `cache: pnpm` is set on purpose. setup-node v6 and later cache
      # automatically for npm only, so pnpm needs the explicit input. pnpm is
      # installed in the step above, so it is on PATH when the cache reads it.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prettier does not format Markdown here. `.prettierignore` gives the
      # reason.
      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # The output of a step is not a terminal, so this prints the JSON
      # result, as it does for an agent.
      - name: Run the built CLI
        run: node packages/loupe/dist/bin.js version

      # The files that each package would publish: each entry point, the
      # README, the CHANGELOG, the LICENSE and the skill, and no other file.
      - name: Check the packages
        run: node scripts/check-pack.mjs

  test:
    name: Test (${{ matrix.os }})
    # loupe runs on all three hosts: iOS work needs macOS, and Android work
    # runs on each one. Path and process code that works on one system can
    # fail on another. Validate covers Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Run the built CLI
        run: node packages/loupe/dist/bin.js version

  ios-runner:
    name: iOS runner
    # The XCTest runner that drives an iOS simulator, built for arm64 and
    # x86_64, as the package ships it: with no test framework of Xcode. The
    # job runs the built CLI on a simulator with that runner, then uploads
    # it. A release takes this build, so it publishes the bytes that this
    # job ran. Xcode 16.4 is the oldest Xcode on the image, and a build from
    # it also runs with Xcode 26. `macos-15` has it; `macos-latest` doesn't.
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # The script gets XcodeGen, pinned by version and SHA-256, and fails
      # when a binary of the runner lacks one of the two slices.
      - name: Build the runner
        run: bash scripts/build-ios-runner.sh "$RUNNER_TEMP/ios-runner-build" "$RUNNER_TEMP/ios-runner"

      - name: Check the runner
        run: node scripts/check-ios-runner.mjs "$RUNNER_TEMP/ios-runner"

      # The built CLI with the runner in its package folder, on a new
      # simulator: the CLI starts the runner, keeps it, and uses it again.
      - name: Run the smoke test on a simulator
        run: node scripts/ios-smoke.mjs "$RUNNER_TEMP/ios-smoke" --runner "$RUNNER_TEMP/ios-runner" --ios 18.5 --device "iPhone 16 Pro"

      - name: Upload the smoke output
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ios-smoke
          path: ${{ runner.temp }}/ios-smoke/
          retention-days: 7
          if-no-files-found: ignore

      # An artifact doesn't keep the executable bits of a file, so the
      # runner goes into a tar file. COPYFILE_DISABLE keeps the `._` files
      # of macOS out of it.
      - name: Pack the runner
        run: COPYFILE_DISABLE=1 tar --no-xattrs -czf "$RUNNER_TEMP/ios-runner.tar.gz" -C "$RUNNER_TEMP/ios-runner" .

      - name: Upload the runner
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ios-runner
          path: ${{ runner.temp }}/ios-runner.tar.gz
          retention-days: 7
          if-no-files-found: error

  android:
    name: Android smoke (API ${{ matrix.api-level }})
    # The built CLI on a clean emulator. API 30 is the lowest level that loupe
    # takes, and 36 is the newest. On an emulator, double-tap, drag and pinch
    # go through the emulator console, so no run here reaches their `input`
    # script: only the fixture tests cover it. At the end, the script opens
    # the probe app in Expo Go (downloaded from Expo, with Metro on
    # localhost), and checks the safe area of the probe against the system's.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # The emulator needs KVM. A Linux runner gives access to it only with
      # this udev rule.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The same emulator as the fixture recorder, so the checks of the
      # script hold for its screen, its insets and its Settings app. With
      # the default 2560 MB, API 36 paged after boot and Settings stopped
      # responding; the RAM changes no screen.
      - name: Run the smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          script: node scripts/android-smoke.mjs "${{ runner.temp }}/android-smoke" ${{ matrix.api-level }}

      - name: Upload the smoke output
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: android-smoke-api-${{ matrix.api-level }}
          path: ${{ runner.temp }}/android-smoke/
          retention-days: 7
          if-no-files-found: ignore
